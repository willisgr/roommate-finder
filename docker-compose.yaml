services:
  db:
    image: mysql:9.7
    container_name: test_db
    environment:
      MYSQL_DATABASE: roommatetest
      MYSQL_ROOT_PASSWORD: rootpassword

    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysql", "-h", "localhost", "-uroot", "-prootpassword", "-e", "SELECT 1" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: DockerFile
    container_name: test_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=test
    depends_on:
      - db
    restart: on-failure

volumes:
  mysql_data:
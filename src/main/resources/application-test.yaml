spring:
  application:
    name: roommate-finder
  datasource:
    url: jdbc:mysql://db:3306/roommatetest?createDatabaseIfNotExist=true
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/migration/test
matcher:
  weights:
    bool: 1, 1, 1
    scale: 1, 1, 1
  scaleMaximums: 5, 5, 3
